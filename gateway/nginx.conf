server {
    listen 80;
    server_name _;

    # Re-resolve Docker service IPs dynamically so container recreations never cause stale 502s
    resolver 127.0.0.11 valid=10s ipv6=off;

    absolute_redirect off;
    client_max_body_size 20M;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Backend API & Media
    location /api/v1/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
    }

    # Admin Frontend (/admin)
    location = /admin {
        set $admin_upstream http://admin:80;
        rewrite ^ /admin/ break;
        proxy_pass $admin_upstream;
        proxy_set_header Host $http_host;
    }

    location /admin/ {
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Frontend (/user)
    location /user {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Default root opens the Welcome Page first
    location = / {
        return 302 /user/welcome;
    }
}
